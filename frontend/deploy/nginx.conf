# Example only: replace BOTH localhost upstreams with your Flask host and port.
# Nginx does not read Vite's .env.local or API_TARGET.
# Keep a customized copy in nginx.local.conf (gitignored) or on the server.
server {
    listen 80;
    server_name _;
    root /var/www/iforgotthings;
    index index.html;
    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
